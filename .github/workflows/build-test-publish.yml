# Build, test, and publish radfiled3d-nn.
#
# Mirrors RadFiled3D's `package-test-publish.yml`: wheels are built with cibuildwheel on Linux and
# `python -m build` on Windows, and publishing is Trusted Publishing (OIDC, `id-token: write`) with
# no token in a secret.
#
# THE TAG IS THE VERSION, for the wheel and for the C++ library inside it. scikit-build-core takes
# it from `build_tools/radfiled3d_nn_version.py` and passes it to CMake as SKBUILD_PROJECT_VERSION,
# which `project(radfiled3d_nn VERSION ...)` uses — so `RadFiled3D.nn.version()`, `rfnn_version()`
# and the wheel's own metadata are one number by construction. The plain C++ jobs below are handed
# it as `-DRFNN_VERSION` for the same reason.
#
# WHAT RUNS WHEN, and why it differs from the reference:
#
#   every push   the C++ suite AND the Python suite. The reference gates its tests on a tag, which
#                means an ordinary push proves nothing; the point of this workflow is to answer
#                "does it build, do the tests pass" on every commit.
#   tag only     publish to PyPI.
#
# WHAT CANNOT RUN HERE: the CUDA, TensorRT, DirectX and Vulkan configurations. A GitHub runner has
# no GPU, so `build-cuda` / `build-trt` / `build-dx` are exercised on developer hardware only and
# their cases are NOT counted by this workflow. What CI covers is the default build (no GPU, no ORT,
# no SDK — the configuration that needs nothing but CMake and a C++20 compiler) and the ONNX one,
# which is where sessions, composition and stage weights are actually driven.
name: build, test, publish

on: [push]

jobs:
  cpp:
    name: C++ ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default option set, which is the one requirements.md R-B2 promises: CMake and a
          # C++20 compiler, nothing else.
          - name: default
            options: ""
          # The configuration that can actually run a model: sessions, composition, stage weights,
          # the external-initializer hand-off. Fetches the ONNX Runtime.
          - name: onnx
            options: "-DRFNN_WITH_ONNX=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # The tag, so a tagged C++ build reports the release it is. Off a branch this resolves to
        # 0.0.0, which is what a working tree that is not a release should say.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DRFNN_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          ${{ matrix.options }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cpp-sanitizers:
    name: C++ memory safety (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RFNN_BUILD_PYTHON=OFF: an ASan-instrumented extension loaded by a stock CPython needs
      # LD_PRELOAD gymnastics and trips interpreter-internal checks, so the pure C++ suite is where
      # the clean, high-signal memory-safety coverage is. -fno-sanitize-recover=all makes a UBSan
      # finding abort, so it fails the job the way an ASan finding does.
      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRFNN_BUILD_PYTHON=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j
      - name: Run under sanitizers
        working-directory: build-asan
        env:
          # Gate on memory CORRUPTION and UB — the classes that crash a consumer's process — not on
          # one-off allocations a process-lifetime singleton legitimately never frees (the ORT
          # environment is deliberately one, see src/backends/onnx.cpp).
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Lint
        run: |
          python -m pip install flake8
          # Syntax errors and undefined names fail the job; style is reported and does not.
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels-linux:
    name: Wheel (Linux, ${{ matrix.python-name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-name: cp311
          - python-version: "3.12"
            python-name: cp312
          - python-version: "3.13"
            python-name: cp313
          - python-version: "3.14"
            python-name: cp314
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD_FRONTEND: "build"
          CIBW_ARCHS: "x86_64"
          # The version provider reads GITHUB_REF, so it has to reach inside the build container.
          CIBW_ENVIRONMENT_PASS_LINUX: "GITHUB_REF"
          CIBW_BUILD: "${{ matrix.python-name }}-manylinux_x86_64"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # C++20 throughout, and RadFiled3D 1.3.6 needs a modern libstdc++. manylinux_2_28's stock
          # GCC 12 is new enough; gcc-toolset-13 is used to match what RadFiled3D's own wheels are
          # built with, so the two extensions share one ABI.
          CIBW_BEFORE_ALL: "dnf install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++"
          CIBW_ENVIRONMENT: "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++"
          # ONNX Runtime is fetched by CMake and vendored into the wheel, so a released wheel can run
          # a model without the user installing anything (requirements.md R-P3).
          CIBW_CONFIG_SETTINGS: "cmake.define.RFNN_WITH_ONNX=ON"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python-name }}
          path: dist/*.whl

  wheels-windows:
    name: Wheel (Windows, ${{ matrix.python-name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            python-name: cp312
          - python-version: "3.13"
            python-name: cp313
          - python-version: "3.14"
            python-name: cp314
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --config-setting=cmake.define.RFNN_WITH_ONNX=ON
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.python-name }}
          path: dist/*.whl

  test-python:
    name: Python tests (${{ matrix.python-name }})
    runs-on: ubuntu-latest
    needs: [wheels-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-name: cp311
          - python-version: "3.12"
            python-name: cp312
          - python-version: "3.13"
            python-name: cp313
          - python-version: "3.14"
            python-name: cp314
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python-name }}
          path: dist/
      # The wheel installs INTO RadFiled3D's package directory, so RadFiled3D must be there first —
      # it is a declared dependency and pip pulls it, but installing the built wheel (rather than
      # the source tree) is what proves the layout works as shipped.
      - name: Install the built wheel
        run: python -m pip install ./dist/*.whl
      - name: Check the namespace resolves as shipped
        run: |
          python - <<'EOF'
          from RadFiled3D import nn
          from RadFiled3D.nn import deploy, inference, memory
          import RadFiled3D.nn.deploy          # a real module, not just an attribute
          import RadFiled3D.RadFiled3D as core  # and RadFiled3D itself still works
          import pathlib, RadFiled3D
          print("RadFiled3D.nn", nn.version(), "at", nn.__file__)
          assert deploy.PackageBuilder and inference.load_rf3m and memory.Memory
          assert nn.GPUCartesianRadiationField
          # RadFiled3D is a REGULAR package, so `RadFiled3D/nn/` only resolves while both
          # distributions share one site-packages. A user-site fallback would install this wheel
          # somewhere else, `RadFiled3D.nn` would vanish, and nothing above would say why. Assert
          # the layout the whole design rests on rather than infer it from an import that happened
          # to work.
          assert (pathlib.Path(nn.__file__).parent.parent
                  == pathlib.Path(RadFiled3D.__file__).parent), (
              f"split install: {nn.__file__} is not inside {RadFiled3D.__file__}")
          EOF
      - name: Test
        run: |
          python -m pip install pytest numpy onnx
          python -m pytest tests/python -v --junit-xml=test-results.xml
      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: Python ${{ matrix.python-version }}

  status:
    name: Status summary
    runs-on: ubuntu-latest
    needs: [cpp, cpp-sanitizers, sdist, wheels-linux, wheels-windows, test-python]
    # `always()` so the summary is written even when something failed — a summary that only appears
    # on success answers the question nobody needed to ask.
    if: always()
    steps:
      # Checked out for `build_tools/radfiled3d_nn_version.py`, which the summary reads the declared
      # version from.
      - uses: actions/checkout@v4
      - name: Report build, tests and the released version
        run: |
          {
            echo "## radfiled3d-nn"
            echo ""
            echo "| what | result |"
            echo "| --- | --- |"
            echo "| C++ build + tests | ${{ needs.cpp.result }} |"
            echo "| C++ sanitizers | ${{ needs.cpp-sanitizers.result }} |"
            echo "| Source distribution | ${{ needs.sdist.result }} |"
            echo "| Wheels (Linux) | ${{ needs.wheels-linux.result }} |"
            echo "| Wheels (Windows) | ${{ needs.wheels-windows.result }} |"
            echo "| Python tests | ${{ needs.test-python.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # The version currently on PyPI, for comparison with the tag being built. A 404 is the
          # ordinary answer before the first release and must not fail the job.
          published=$(curl -fsSL https://pypi.org/pypi/radfiled3d-nn/json 2>/dev/null \
                      | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" \
                      2>/dev/null || echo "not published yet")
          {
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| latest on PyPI | \`$published\` |"
            echo "| this ref | \`${GITHUB_REF##*/}\` |"
            echo "| version being built | \`$(python -c "import sys; sys.path.insert(0,'build_tools'); import radfiled3d_nn_version as v; print(v.resolve_version())" 2>/dev/null || echo unknown)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only a release tag publishes, and only after everything that can fail has passed.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cpp, cpp-sanitizers, test-python, sdist, wheels-linux, wheels-windows]
    environment:
      name: pypi
      url: https://pypi.org/p/radfiled3d-nn
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there is no API token to
    # store, leak or rotate. Configure the publisher on PyPI for this repository and workflow file.
    permissions:
      id-token: write
    steps:
      - name: Collect every wheel and the sdist
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      # A PyPI version can never be reused, so a wheel published as `0.0.0` is unrecoverable.
      # `GITHUB_REF` reaches the build container through `environment-pass`, which cibuildwheel
      # applies under `contextlib.suppress(KeyError)` — if it ever failed to arrive, every artifact
      # would silently carry `0.0.0` instead of failing. This is the one place that can still catch
      # it, and it costs a second.
      - name: Refuse to publish artifacts that do not carry the tag
        run: |
          shopt -s nullglob   # so an empty dist/ reports "no artifacts", not a literal `*`
          tag="${GITHUB_REF##*/}"
          echo "tag: $tag"
          ls -1 dist/
          expected="radfiled3d_nn-$tag"
          bad=0
          for f in dist/*; do
            case "$(basename "$f")" in
              "$expected"-*|"$expected".tar.gz) ;;
              *) echo "::error::$(basename "$f") does not carry version $tag"; bad=1 ;;
            esac
          done
          [ "$(ls -1 dist/ | wc -l)" -gt 0 ] || { echo "::error::no artifacts to publish"; bad=1; }
          exit $bad

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
