# Tag -> test -> publish.
#
# A tag is a release. Everything that can fail runs first, and PyPI is written only if all of it
# passed: `publish` needs every test job, so one red test means no release rather than a bad one.
#
# THE TAG IS THE VERSION, for the wheel and for the C++ library inside it. scikit-build-core takes
# it from `build_tools/radfiled3d_nn_version.py` and passes it to CMake as SKBUILD_PROJECT_VERSION,
# which `project(radfiled3d_nn VERSION ...)` uses — so `RadFiled3D.nn.version()`, `rfnn_version()`
# and the wheel's own metadata are one number by construction. The plain C++ jobs are handed it as
# `-DRFNN_VERSION` for the same reason. Tag as `1.2.3`, with no `v` prefix: anything that does not
# match `X.Y.Z` resolves to 0.0.0.
#
# Publishing is Trusted Publishing (OIDC, `id-token: write`) — there is no API token to store,
# leak or rotate. Configure the publisher on PyPI for this repository and this workflow file.
#
# WHAT CANNOT RUN HERE: the CUDA, TensorRT, DirectX and Vulkan configurations. A GitHub runner has
# no GPU, so those are exercised on developer hardware only and a green release does not speak for
# them. What CI covers is the default build — which already carries ONNX Runtime, since that is not
# optional — and so drives sessions, composition and stage weights.
name: release

on:
  push:
    tags: ['*']

jobs:
  cpp:
    name: C++ tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU-only, which is the ONLY thing a GitHub runner can honestly test: it has no GPU.
          # The empty option set is exactly that — ONNX Runtime on the CPU provider, no accelerator
          # backend, no graphics SDK (R-B2). A step below asserts it rather than assuming it.
          - name: cpu
            options: ""
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DRFNN_VERSION=${{ github.ref_name }}
          ${{ matrix.options }}
      # CI HAS NO GPU, so it may only ever build the CPU-only configuration: ONNX Runtime on the
      # CPU provider and no accelerator backend at all. That is already what the empty option set
      # gives, but nothing said so — this fails loudly if a GPU option is ever switched on here,
      # instead of producing a green badge for a configuration no runner can actually exercise.
      # The GPU configurations are developer-hardware only (see CLAUDE.md).
      - name: Confirm the configuration is CPU-only
        run: |
          for opt in CUDA TENSORRT ROCM DIRECTML VULKAN DX11 DX12; do
            value=$(grep -E "^RFNN_WITH_$opt:BOOL=" build/CMakeCache.txt | cut -d= -f2)
            if [ "$value" != "OFF" ]; then
              echo "::error::RFNN_WITH_$opt=$value — a GitHub runner has no GPU; CI builds CPU-only"
              exit 1
            fi
          done
          echo "CPU-only: every accelerator backend is OFF, ONNX Runtime is on the CPU provider."
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cpp-sanitizers:
    name: C++ memory safety (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RFNN_BUILD_PYTHON=OFF: an ASan-instrumented extension loaded by a stock CPython needs
      # LD_PRELOAD gymnastics and trips interpreter-internal checks, so the pure C++ suite is where
      # the clean, high-signal memory-safety coverage is. -fno-sanitize-recover=all makes a UBSan
      # finding abort, so it fails the job the way an ASan finding does.
      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRFNN_BUILD_PYTHON=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j
      - name: Run under sanitizers
        working-directory: build-asan
        env:
          # Gate on memory CORRUPTION and UB — the classes that crash a consumer's process — not on
          # one-off allocations a process-lifetime singleton legitimately never frees (the ORT
          # environment is deliberately one, see src/backends/onnx.cpp).
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels-linux:
    name: Wheel (manylinux_2_28, ${{ matrix.python-name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ONE manylinux tag is technically supportable here, and it is decided by the vendored
        # ONNX Runtime rather than by taste:
        #
        #   * `libonnxruntime.so` 1.29.0 imports symbols versioned GLIBC_2.28, so manylinux2014
        #     (glibc 2.17) cannot load it. A wheel built there would install and fail at import.
        #     RadFiled3D can publish that tag only because it vendors no ORT.
        #   * musllinux is out from the other side: Microsoft publishes no musl build of ORT.
        #   * manylinux_2_34 would be REDUNDANT, not extra coverage. auditwheel tags a wheel by the
        #     symbols it actually needs, not by the image it was built in (RadFiled3D's own wheel is
        #     tagged manylinux_2_27.manylinux_2_28 — a computed policy), so a 2_34 build of this
        #     package resolves to manylinux_2_28 again and collides with this one by filename. And a
        #     manylinux_2_28 wheel already installs on ANY glibc >= 2.28, so 2_34 would serve a
        #     strict subset of the same users.
        python-name: [cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Only runs cibuildwheel itself; the interpreters that build the wheels live in the
          # container and are chosen by CIBW_BUILD.
          python-version: "3.13"
      - name: Build wheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD_FRONTEND: "build"
          CIBW_ARCHS: "x86_64"
          # The version provider reads GITHUB_REF, so it has to reach inside the build container.
          CIBW_ENVIRONMENT_PASS_LINUX: "GITHUB_REF"
          CIBW_BUILD: "${{ matrix.python-name }}-manylinux_x86_64"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.12"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # gcc-toolset-13 matches what RadFiled3D's own wheels are built with, so the two
          # extensions share one ABI — which is what lets `to_host_field()` hand back RadFiled3D's
          # own type through the pybind11 registry.
          CIBW_BEFORE_ALL: "dnf install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++"
          CIBW_ENVIRONMENT: "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python-name }}
          path: dist/*.whl

  wheels-windows:
    name: Wheel (Windows, ${{ matrix.python-name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            python-name: cp312
          - python-version: "3.13"
            python-name: cp313
          - python-version: "3.14"
            python-name: cp314
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.python-name }}
          path: dist/*.whl

  test-python:
    name: Python tests (${{ matrix.python.name }})
    runs-on: ubuntu-latest
    needs: [wheels-linux]
    strategy:
      fail-fast: false
      matrix:
        # Both images are published, so both are tested; a wheel nobody installed is a wheel nobody
        # knows loads.
        # An OBJECT per entry so the interpreter and its wheel tag travel together.
        python:
          - { version: "3.12", name: cp312 }
          - { version: "3.13", name: cp313 }
          - { version: "3.14", name: cp314 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python.name }}
          path: dist/
      # Installing the BUILT WHEEL rather than the source tree is what proves the layout works as
      # shipped; RadFiled3D comes with it as a declared dependency.
      - name: Install the built wheel
        run: python -m pip install ./dist/*.whl
      - name: Check the namespace resolves as shipped
        run: |
          python - <<'EOF'
          from RadFiled3D import nn
          from RadFiled3D.nn import deploy, inference, memory
          import RadFiled3D.nn.deploy          # a real module, not just an attribute
          import RadFiled3D.RadFiled3D as core  # and RadFiled3D itself still works
          import pathlib, RadFiled3D
          print("RadFiled3D.nn", nn.version(), "at", nn.__file__)
          assert deploy.PackageBuilder and inference.load_rf3m and memory.Memory
          assert nn.GPUCartesianRadiationField
          # RadFiled3D is a REGULAR package, so `RadFiled3D/nn/` only resolves while both
          # distributions share one site-packages. A user-site fallback would install this wheel
          # somewhere else, `RadFiled3D.nn` would vanish, and nothing above would say why. Assert
          # the layout the whole design rests on rather than infer it from an import that happened
          # to work.
          assert (pathlib.Path(nn.__file__).parent.parent
                  == pathlib.Path(RadFiled3D.__file__).parent), (
              f"split install: {nn.__file__} is not inside {RadFiled3D.__file__}")
          EOF
      - name: Test
        run: |
          python -m pip install pytest numpy onnx
          python -m pytest tests/python -v --junit-xml=test-results.xml
      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: Python ${{ matrix.python.version }}

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Every test gates the release. One red job means no publish, not a bad publish.
    needs: [cpp, cpp-sanitizers, test-python, sdist, wheels-linux, wheels-windows]
    environment:
      name: pypi
      url: https://pypi.org/p/radfiled3d-nn
    permissions:
      id-token: write
    steps:
      - name: Collect every wheel and the sdist
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      # A PyPI version can never be reused, so a wheel published as `0.0.0` is unrecoverable.
      # `GITHUB_REF` reaches the build container through `environment-pass`, which cibuildwheel
      # applies under `contextlib.suppress(KeyError)` — if it ever failed to arrive, every artifact
      # would silently carry `0.0.0` instead of failing. This is the one place that can still catch
      # it, and it costs a second.
      - name: Refuse to publish artifacts that do not carry the tag
        run: |
          shopt -s nullglob   # so an empty dist/ reports "no artifacts", not a literal `*`
          tag="${GITHUB_REF##*/}"
          echo "tag: $tag"
          ls -1 dist/
          expected="radfiled3d_nn-$tag"
          bad=0
          for f in dist/*; do
            case "$(basename "$f")" in
              "$expected"-*|"$expected".tar.gz) ;;
              *) echo "::error::$(basename "$f") does not carry version $tag"; bad=1 ;;
            esac
          done
          [ "$(ls -1 dist/ | wc -l)" -gt 0 ] || { echo "::error::no artifacts to publish"; bad=1; }
          exit $bad

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
