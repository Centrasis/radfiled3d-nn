# Python packaging for radfiled3d-nn.
#
# The same stack RadFiled3D uses: scikit-build-core drives CMake (RFNN_BUILD_PYTHON=ON), which
# fetches and builds RadFiled3D and BLAKE3 and — with RFNN_WITH_ONNX — fetches the ONNX Runtime and
# vendors it into the package (requirements.md R-P3). A user therefore needs neither a RadFiled3D
# checkout nor an SDK to `pip install` a released wheel; building from an sdist needs CMake and a
# C++20 compiler, the same prerequisites RadFiled3D itself has.
#
#   pip install -v .
#   pip install -v --config-settings=cmake.define.RFNN_WITH_ONNX=ON .
#   pip wheel . -w dist
[build-system]
# pybind11-stubgen runs during the CMake build to extract _rfnn.pyi from the built module.
# It must be here rather than merely installed in the target environment: pip builds in an
# isolated environment, and that is where the build step looks for it.
#
# The pybind11 specifier deliberately MIRRORS RadFiled3D's, character for character. The two wheels
# must resolve the same pybind11: its per-process type registry is keyed by version and ABI, and
# only a match lets `GPUCartesianRadiationField.to_host_field()` return RadFiled3D's own
# `CartesianRadiationField`. Widening or narrowing this without doing the same there breaks that
# handover at run time, not at build time. (python/CMakeLists.txt covers the non-pip path.)
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "pybind11-stubgen>=2.5"]
build-backend = "scikit_build_core.build"

[project]
name = "radfiled3d-nn"
# Read from `project(radfiled3d_nn VERSION ...)` in CMakeLists.txt, so the wheel and the C++ library
# it ships can never disagree about their version. See build_tools/radfiled3d_nn_version.py.
dynamic = ["version"]
description = "RF3M: a deployment container and GPU inference runtime for neural radiation fields."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Felix Lehner" }]
keywords = ["radiation", "dosimetry", "onnx", "inference", "radfiled3d"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]
# RadFiled3D is REQUIRED, and not merely because the runtime produces its fields: this wheel installs
# into RadFiled3D's own package directory so that `import RadFiled3D.nn` resolves (RadFiled3D ships a
# regular package, so its `__path__` is one directory and a subpackage must live in it). The floor
# matches RADFILED3D_TAG, the version the C++ side is compiled against — `to_host_field()` hands back
# RadFiled3D's own `CartesianRadiationField` through a pybind type registry keyed by version and ABI.
dependencies = ["RadFiled3D>=1.3.6"]

[project.optional-dependencies]
numpy = ["numpy>=2.0"]
# Exporting a PyTorch module to ONNX (RadFiled3D.nn.torch_export). Optional and lazily imported:
# a consumer that only reads packages must not pay for a torch install. `onnx` is what lets the
# exporter check that the graph really declares the tensor names the package promises.
torch = ["torch>=2.6", "onnx>=1.17"]

[project.urls]
Repository = "https://github.com/Centrasis/radfiled3d-nn"

[project.scripts]
rf3m = "RadFiled3D.nn:_cli"

[tool.scikit-build]
# Mixed layout: the compiled extension `_rfnn` (and its generated .pyi) is installed by CMake into
# the same package that carries the pure-Python half.
#
# `python/RadFiled3D` carries NO `__init__.py` of its own — RadFiled3D's wheel owns that file, and
# shipping a second one would have two distributions fighting over it. Only `RadFiled3D/nn/` is ours.
wheel.packages = ["python/RadFiled3D"]
cmake.version = ">=3.24"
cmake.build-type = "Release"
build.verbose = false
# Required to load the version provider out of build_tools/.
experimental = true

[tool.scikit-build.metadata.version]
provider = "radfiled3d_nn_version"
provider-path = "build_tools"

[tool.scikit-build.cmake.define]
RFNN_BUILD_PYTHON = "ON"
RFNN_BUILD_TESTS = "OFF"
RFNN_BUILD_TOOLS = "OFF"
RFNN_BUILD_EXAMPLES = "OFF"
RFNN_INSTALL = "OFF"

[tool.scikit-build.sdist]
# `include` WINS over `exclude` in scikit-build-core, so these patterns are file-shaped rather than
# directory-shaped: a blanket "tests/" would sweep every `__pycache__` back in and no exclusion could
# take it out again.
include = [
    "CMakeLists.txt", "LICENSE", "README.md",
    "cmake/*.cmake",
    "include/**/*.hpp", "include/**/*.h",
    "src/**/*.cpp",
    "python/CMakeLists.txt", "python/bindings/*.cpp", "python/RadFiled3D/**/*.py",
    "python/RadFiled3D/**/py.typed",
    "build_tools/*.py",
    # The suite ships so an sdist can be tested where it is built.
    "tests/CMakeLists.txt", "tests/*.cpp", "tests/*.hpp", "tests/python/*.py",
]
exclude = ["/build*", "**/__pycache__", "**/*.pyc", "**/*.rf3m", "/.pytest_cache", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
